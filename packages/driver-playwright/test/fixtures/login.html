<!doctype html>
<meta charset="utf-8">
<title>Login fixture</title>
<h1>Sign in</h1>
<form id="f">
  <p><label for="email">Email</label> <input id="email" type="email"></p>
  <p><label for="pw">Password</label> <input id="pw" type="password"></p>
  <p><label><input id="remember" type="checkbox"> Remember me</label></p>
  <p><button type="submit">Log in</button> <button type="button" disabled>Single sign-on</button></p>
  <p><a href="#forgot">Forgot password?</a></p>
  <p id="err" style="color:red"></p>
</form>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    if (email === "qa@example.com" && document.getElementById("pw").value === "s3cret-pw") {
      document.body.innerHTML = '<h1>Welcome, ' + email + '</h1><p><a href="#logout">Log out</a></p>';
      history.pushState({}, "", "/home");
    } else {
      document.getElementById("err").textContent = "Invalid email or password";
    }
  });
</script>
